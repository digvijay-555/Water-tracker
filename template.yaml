AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Water Tracker (WaterSaathi) - Complete Full-Stack Production Architecture
  Serverless REST API (API Gateway + 12 Lambdas + 4 DynamoDB Tables) and
  Secure S3 + CloudFront CDN Frontend Distribution for Hackathon Qualification.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs20.x
    Architectures:
      - x86_64
    Environment:
      Variables:
        TANKERS_TABLE: !Ref TankersTable
        REQUESTS_TABLE: !Ref RequestsTable
        BOOKINGS_TABLE: !Ref BookingsTable
        REPORTS_TABLE: !Ref ShortageReportsTable
        CORS_ALLOW_ORIGIN: '*'
        NODE_ENV: production
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Idempotency-Key'"
      AllowOrigin: "'*'"

Resources:
  # ==========================================
  # 1. DynamoDB Tables (Pay-Per-Request, Free-Tier Friendly)
  # ==========================================
  TankersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WaterTracker-Tankers-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: tankerId
          AttributeType: S
      KeySchema:
        - AttributeName: tankerId
          KeyType: HASH

  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WaterTracker-Requests-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WaterTracker-Bookings-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bookingId
          AttributeType: S
      KeySchema:
        - AttributeName: bookingId
          KeyType: HASH

  ShortageReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "WaterTracker-ShortageReports-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH

  # ==========================================
  # 2. Serverless Lambda Handlers & API Routes
  # ==========================================

  # 1. Tanker Discovery: GET /tankers
  TankerDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/tankers/discovery.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
      Events:
        GetTankers:
          Type: Api
          Properties:
            Path: /tankers
            Method: GET

  # 2. Tanker Location: POST /tankers/{id}/location
  TankerLocationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/tankers/location.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
      Events:
        UpdateLocation:
          Type: Api
          Properties:
            Path: /tankers/{id}/location
            Method: POST

  # 3. Create Request: POST /requests
  RequestCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/requests/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TankersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
      Events:
        CreateRequest:
          Type: Api
          Properties:
            Path: /requests
            Method: POST

  # 4. Get Request: GET /requests/{id}
  RequestGetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/requests/get.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RequestsTable
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
      Events:
        GetRequest:
          Type: Api
          Properties:
            Path: /requests/{id}
            Method: GET

  # 5. Join Pool: POST /requests/{id}/join-pool
  RequestJoinPoolFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/requests/pool.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
      Events:
        JoinPool:
          Type: Api
          Properties:
            Path: /requests/{id}/join-pool
            Method: POST

  # 6. List Bookings: GET /bookings
  BookingListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/bookings/list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RequestsTable
      Events:
        ListBookings:
          Type: Api
          Properties:
            Path: /bookings
            Method: GET

  # 7. Accept Booking: POST /bookings/{id}/accept
  BookingAcceptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/bookings/accept.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
      Events:
        AcceptBooking:
          Type: Api
          Properties:
            Path: /bookings/{id}/accept
            Method: POST

  # 8. Reject Booking: POST /bookings/{id}/reject
  BookingRejectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/bookings/reject.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
      Events:
        RejectBooking:
          Type: Api
          Properties:
            Path: /bookings/{id}/reject
            Method: POST

  # 9. Update Booking Status: POST /bookings/{id}/status
  BookingStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/bookings/status.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequestsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TankersTable
      Events:
        UpdateStatus:
          Type: Api
          Properties:
            Path: /bookings/{id}/status
            Method: POST

  # 10. Shortage Report Create: POST /shortage-reports
  ShortageReportCreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/reports/create.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ShortageReportsTable
      Events:
        CreateReport:
          Type: Api
          Properties:
            Path: /shortage-reports
            Method: POST

  # 11. Shortage Report List: GET /admin/shortage-reports
  ShortageReportListFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/reports/list.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ShortageReportsTable
      Events:
        ListReports:
          Type: Api
          Properties:
            Path: /admin/shortage-reports
            Method: GET

  # 12. Shortage Report Status: POST /admin/shortage-reports/{id}/status
  ShortageReportStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: backend/src/reports/status.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ShortageReportsTable
      Events:
        UpdateReportStatus:
          Type: Api
          Properties:
            Path: /admin/shortage-reports/{id}/status
            Method: POST

  # ==========================================
  # 3. Frontend Static Hosting (S3 + CloudFront CDN + OAC)
  # ==========================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "water-tracker-web-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "WaterTrackerOAC-${AWS::StackName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: "Water Tracker Single Page Application CDN"
        DefaultRootObject: index.html
        Origins:
          - Id: S3FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  WaterTrackerApiEndpoint:
    Description: "API Gateway production endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  FrontendUrl:
    Description: "Live CloudFront HTTPS URL for the Web Application"
    Value: !Sub "https://${FrontendDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-FrontendUrl"

  FrontendBucketName:
    Description: "S3 Bucket Name for deployment of the Vite web bundle"
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucket"

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID for cache invalidation"
    Value: !Ref FrontendDistribution
    Export:
      Name: !Sub "${AWS::StackName}-DistributionId"

  TankersTableName:
    Description: "DynamoDB Tankers Table Name"
    Value: !Ref TankersTable

  RequestsTableName:
    Description: "DynamoDB Requests Table Name"
    Value: !Ref RequestsTable

  BookingsTableName:
    Description: "DynamoDB Bookings Table Name"
    Value: !Ref BookingsTable

  ShortageReportsTableName:
    Description: "DynamoDB Shortage Reports Table Name"
    Value: !Ref ShortageReportsTable
